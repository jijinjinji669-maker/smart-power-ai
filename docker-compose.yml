services:
  db:
    # 不用 timescale/timescaledb 官方镜像：约 500MB，国内加速器多无缓存，
    # 会回落直连 Docker Hub 导致下载龟速甚至中断（本项目在阿里云 ECS 上实测卡死在这一步）。
    # 改为基于 postgres:16（约 140MB，各加速器均有缓存）本地构建，
    # TimescaleDB 扩展通过 apt 安装。详见 db/Dockerfile。
    build:
      context: ./db
      dockerfile: Dockerfile
    restart: always
    environment:
      POSTGRES_USER: power
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: power
      # 针对 3.5G 小内存调优，避免 PG 默认配置吃光内存
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=60
      - -c
      - wal_compression=on
      # shared_preload_libraries 不在这里设置：
      # postgres 官方 entrypoint 会用 initdb 重新生成 postgresql.conf，
      # -c 传入的参数在 initdb 阶段不生效。扩展的预加载配置写在
      # db/Dockerfile 中的 postgresql.conf.sample 里。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U power -d power"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 刻意不声明 ports：数据库仅在同一 compose 网络内可达，绝不暴露公网
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  mqtt:
    image: emqx/emqx:5.8
    restart: always
    environment:
      EMQX_ALLOW_ANONYMOUS: "true"
      EMQX_NODE__NAME: "emqx@127.0.0.1"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_PASSWORD:?EMQX_PASSWORD is required}
    volumes:
      - emqxdata:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: power
      DB_NAME: power
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 只监听回环地址：公网访问一律经 Nginx，避免绕过 HTTPS 直连后端
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging: *default-logging

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: ["python", "-m", "app.consumer"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: power
      DB_NAME: power
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      # 不能省略这一段：Dockerfile 里的 HEALTHCHECK 是给 api 探活 8000 端口的，
      # 而 consumer 与 api 共用同一镜像，会继承那条探针，
      # 然后因为不监听 8000 端口而永远显示 unhealthy —— 探针问错了问题。
      #
      # 这里换成业务级健康检查：consumer 每成功入库一批就刷新 Redis 里的
      # heartbeat:consumer 时间戳，探针判断该时间戳是否在 180 秒内。
      # 检查的是"最近真的处理过数据吗"，因此"进程活着但消费停滞"也会被标记出来。
      test: ["CMD", "python", "-m", "app.healthcheck", "--service", "consumer", "--max-age", "180"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging: *default-logging

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: power
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: power
      # 异常区间标注与 LLM 诊断走 api 服务，而不是直连数据库：
      # 诊断逻辑在服务端，且该接口会产生 API 费用，必须由服务端统一控制
      API_BASE_URL: http://api:8000
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      # 只监听回环地址，公网访问经 Nginx 反代（配置见 nginx/smart-power.conf）。
      # 调试期如需直接用 IP 访问，可临时改成 "8501:8501" 并在安全组放行 8501，
      # 但 Streamlit 本身没有鉴权，看完务必改回来。
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    # 20 台覆盖四个档位：4 照明 + 6 插座 + 6 空调 + 4 总开关。
    # 设备数少于 20 时用不到空调和总开关档位，分档设计就白做了。
    # --fault-level：realistic 对齐真实年故障率 / demo 演示 / off 纯手动注入
    command: ["python", "-m", "simulator.breaker_sim",
              "--devices", "20", "--interval", "5", "--fault-level", "demo"]
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
    depends_on:
      mqtt:
        condition: service_healthy
    healthcheck:
      # 显式关闭：simulator 同样会继承 api 镜像的 8000 端口探针。
      # 它是数据源（不是被监控对象），也刻意不依赖 Redis，
      # 所以直接关掉，避免无意义的 unhealthy 状态。
      disable: true
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  emqxdata:
