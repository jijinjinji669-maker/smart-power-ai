# 智慧用电 AI 监控平台 · Nginx 反向代理
#
# 部署步骤：
#   sudo cp nginx/smart-power.conf /etc/nginx/sites-available/smart-power
#   sudo ln -s /etc/nginx/sites-available/smart-power /etc/nginx/sites-enabled/
#   sudo sed -i 's/power.example.com/你的域名/' /etc/nginx/sites-available/smart-power
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d 你的域名        # 自动配 HTTPS
#
# 路由规划：
#   /        -> Streamlit 看板（8501）
#   /api/    -> FastAPI（8000），/docs 看 Swagger
#   /health  -> API 健康检查

upstream smart_power_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream smart_power_dashboard {
    server 127.0.0.1:8501;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name power.example.com;

    # 上传/请求体上限，防止有人塞超大 payload
    client_max_body_size 8m;
    client_body_timeout 30s;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 压缩：Streamlit 的 JS 包和 API 的 JSON 都能压掉一大半，
    # 对小带宽服务器（3-5 Mbps）体感差别很明显
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain
               application/xml image/svg+xml;

    access_log /var/log/nginx/smart-power.access.log;
    error_log  /var/log/nginx/smart-power.error.log warn;

    # ---------------- API ----------------
    location /api/ {
        proxy_pass http://smart_power_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_next_upstream error timeout http_502;
    }

    # FastAPI 自动生成的接口文档
    location /docs {
        proxy_pass http://smart_power_api/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://smart_power_api/openapi.json;
        proxy_set_header Host $host;
    }

    # ---------------- 看板（Streamlit）----------------
    location / {
        proxy_pass http://smart_power_dashboard;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit 靠 WebSocket 推送界面更新，这两行是必须的，
        # 否则页面能打开但一直转圈、点按钮没反应
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Streamlit 会话可能较长，超时要放宽
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # Streamlit 健康检查端点，不记日志
    location = /_stcore/health {
        proxy_pass http://smart_power_dashboard/_stcore/health;
        access_log off;
    }

    location = /health {
        proxy_pass http://smart_power_api/health;
        access_log off;
    }

    # 隐藏文件、备份文件一律拒绝
    location ~ /\.(?!well-known) { deny all; }
}
