# 先把 http:// 换成你的域名，或保留 IP 先用着
# 放到 /etc/nginx/sites-available/smart-power 然后建软链到 sites-enabled

upstream smart_power_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name power.example.com;

    # 上传/请求体上限，防止有人塞超大 payload
    client_max_body_size 8m;
    client_body_timeout 30s;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 压缩：小带宽服务器必配，JSON 通常能压到 1/5
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain
               application/xml image/svg+xml;

    access_log /var/log/nginx/smart-power.access.log;
    error_log  /var/log/nginx/smart-power.error.log warn;

    location / {
        proxy_pass http://smart_power_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 后端重启期间返回友好提示而不是 502
        proxy_next_upstream error timeout http_502;
    }

    # FastAPI 自带的 /docs 与 /openapi.json 保留公开，方便演示
    location = /health {
        proxy_pass http://smart_power_api/health;
        access_log off;
    }

    # 隐藏文件、备份文件一律拒绝
    location ~ /\.(?!well-known) { deny all; }
}
